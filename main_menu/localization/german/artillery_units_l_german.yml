 #Unit descriptions
 a_light_houfnice_desc: "Man nimmt an, dass moderne Haubitzen ihren Namen der Houfnice-Artillerie zu verdanken haben, die von den Hussiten im 15. Jahrhundert entwickelt wurde. Diese kurzläufigen Kanonen wurden auf Wägen montiert und unterstützten die Infanterie auf dem Schlachtfeld, indem sie Feuerbälle und Kanister verschossen."
 a_heavy_houfnice_desc: "Man nimmt an, dass moderne Haubitzen ihren Namen der Houfnice-Artillerie zu verdanken haben, die von den Hussiten im 15. Jahrhundert entwickelt wurde. Diese kurzläufigen Kanonen wurden auf Wägen montiert und unterstützten die Infanterie auf dem Schlachtfeld, indem sie Feuerbälle und Kanister verschossen."
 a_experimental_engineers_desc: "Die $a_experimental_engineers$ sind Spezialisten, die Befestigungen, Brücken und andere Strukturen bauen können, um die Armee im Feld und bei Belagerungen zu unterstützen."
 a_light_falconet_desc: "Das $a_light_falconet$ ist eine leichte Kanone, die im 15. Jahrhundert als Weiterentwicklung des ähnlichen Falkons entwickelt wurde. Sie ist beweglicher und feuert ein kleineres Kaliber ab."
 a_heavy_falconet_desc: "Das $a_heavy_falconet$ ist eine leichte Kanone, die im 15. Jahrhundert als Weiterentwicklung des ähnlichen Falkons entwickelt wurde. Sie ist beweglicher und feuert ein kleineres Kaliber ab."
 a_early_engineers_desc: "Die $a_early_engineers$ sind Spezialisten, die Befestigungen, Brücken und andere Strukturen bauen können, um die Armee im Feld und bei Belagerungen zu unterstützen."
 a_light_chambered_cannon_desc: "Im 16. Jahrhundert wurde nicht nur die Beweglichkeit der Artillerie verbessert, sondern es wurde auch versucht, Größe und Gewicht von Artilleriegeschossen zu standardisieren."
 a_heavy_chambered_cannon_desc: "Im 16. Jahrhundert wurde nicht nur die Beweglichkeit der Artillerie verbessert, sondern es wurde auch versucht, Größe und Gewicht von Artilleriegeschossen zu standardisieren."
 a_advanced_engineers_desc: "Die $a_advanced_engineers$ sind Spezialisten, die Befestigungen, Brücken und andere Strukturen bauen können, um die Armee im Feld und bei Belagerungen zu unterstützen."
 a_light_royal_mortar_desc: "Ab der zweiten Hälfte des 17. Jahrhunderts verbreitete sich der Einsatz von Artillerie auf dem Schlachtfeld, da die Truppen ihre Feldkanonen nun deutlich einfacher und schneller bewegen konnten."
 a_heavy_royal_mortar_desc: "Ab der zweiten Hälfte des 17. Jahrhunderts verbreitete sich der Einsatz von Artillerie auf dem Schlachtfeld, da die Truppen ihre Feldkanonen nun deutlich einfacher und schneller bewegen konnten."
 a_early_modern_engineers_desc: "Die $a_early_modern_engineers$ sind Spezialisten, die Befestigungen, Brücken und andere Strukturen bauen können, um die Armee im Feld und bei Belagerungen zu unterstützen."
 a_light_flying_battery_desc: "Artillerie ist verheerend auf dem Schlachtfeld, aber vollkommen nutzlos, wenn der Feind sich nicht innerhalb der Kampfreichweite befindet. Eine $a_light_flying_battery$ kann selbständig an jenen Ort verlegen, wo sie am meisten gebraucht wird, und dann rasch neu verlegen, ehe der Feind reagieren kann."
 a_heavy_flying_battery_desc: "Artillerie ist verheerend auf dem Schlachtfeld, aber vollkommen nutzlos, wenn der Feind sich nicht innerhalb der Kampfreichweite befindet. Eine $a_heavy_flying_battery$ kann selbständig an jenen Ort verlegen, wo sie am meisten gebraucht wird, und dann rasch neu verlegen, ehe der Feind reagieren kann."
 a_advanced_early_modern_engineers_desc: "Die $a_advanced_early_modern_engineers$ sind Spezialisten, die Befestigungen, Brücken und andere Strukturen bauen können, um die Armee im Feld und bei Belagerungen zu unterstützen."
 